findings:
  - id: "R2-500"
    kind: variant
    title: "--auto aprova git push: a classe never_auto depende do rule_id, nao do efeito resolvido"
    severity: P1
    confidence: high
    status: confirmed
    evidence_level: E3
    root_cause: "RC-01"
    class: ["policy-bypass", "excessive-agency", "owasp:LLM06", "owasp:LLM01", "trifecta:external-communication"]
    boundary: "B2"
    preconditions: "operador usa --auto (panda run --auto ou cockpit/REPL com auto); o modelo emite run_shell com um push embrulhado (env, timeout, git -c, git -C, caminho absoluto) ou o corpus traz uma .panda/policy.json propria; nenhuma aprovacao humana"
    locations:
      - "src/panda_cli/runtime.py:46@704f387"
      - "src/panda_cli/runtime.py:118-122@704f387"
      - "src/panda_core/policy.py:449-463@704f387"
      - "src/panda_core/tools.py:232-250@704f387"
      - "src/panda_core/shell_policy.py:35@704f387"
    claim: "ChatRuntime._approve recusa so os rule_id {shell-push, shell-git-push, git-push}; decide_shell devolve a Decision das regras de texto sempre que o classificador nao escala estritamente, entao um push com o mesmo efeito 'ask' chega com rule_id shell-default-ask, None ou o id de uma regra do corpus e e auto-aprovado."
    evidence:
      - {leg: A, method: static, detail: "runtime.py:122 `return request.rule_id not in NEVER_AUTO_RULES`; policy.py:462 `if SEVERITY[worst.effect] <= SEVERITY[base.effect]: return base` (base = _decide_rules sobre o texto); o glob de texto da regra shell-push so casa 'git push*', entao 'env git push', 'git -C . push', '/usr/bin/git push' caem em shell-default-ask; o classificador tambem devolve 'ask' (shell-git-push), mas igualdade de severidade devolve base. 'timeout' nao esta em _WRAPPERS (shell_policy.py:35). Com policy.json do corpus sem regra 'shell-push', base.rule_id e None ou o id do corpus."}
      - {leg: B, method: executed, command: "cd /home/user/panda-audit-src && python -m pytest -p no:cacheprovider -q --rootdir=../panda-audit-out/poc/E ../panda-audit-out/poc/E/test_r2_500_auto_never_publishes.py", output_excerpt: "FAILED ...[env git push origin main]\nFAILED ...[timeout 5 git push origin main]\nFAILED ...[git -c user.name=x push origin main]\nFAILED ...[git -C . push origin main]\nFAILED ...[/usr/bin/git push origin main]\nFAILED ...under_a_corpus_supplied_policy[git push origin main]\n6 failed, 1 passed in 1.95s"}
      - {leg: B, method: spy, detail: "script direto sobre PolicyEngine.decide: politica padrao -> 'env git push origin main' effect=ask rule=shell-default-ask; politica vazia -> 'git push origin main' rule=None; regra do corpus {id: corpus-shell, shell, *, ask} -> rule=corpus-shell; todos auto_approves=True"}
    falsification: "Conferi se outro ponto barra o push no caminho real: tools._authorize (tools.py:232-250) monta o ApprovalRequest exatamente com decision.rule_id e chama ctx.approve = ChatRuntime._approve; nao ha outra checagem antes de run_command. O teste existente test_auto_never_approves_a_push passa o rule_id a mao e o teste end-to-end so usa 'git push origin main' com a politica padrao, por isso a suite fica verde."
    impact: "Quebra a promessa C-5 e o fix de APR-004: um modelo guiado por texto do corpus publica commits (canal de exfiltracao para um remote controlado pelo atacante via `git -c remote.x.url=...` ou um remote ja configurado) sem nenhuma pessoa aprovar."
    fix:
      approach: "decidir a classe never_auto pelo efeito resolvido, nao pelo nome da regra: o classificador marca o verdict com um atributo `publishes=True` (ou classe 'never_auto') que sobrevive a fusao em decide_shell; Decision ganha campo `never_auto: bool`; _approve recusa se decision.never_auto. Em decide_shell, quando worst e base tem a mesma severidade, mesclar flags (OR) em vez de devolver base cru. Acrescentar 'timeout', 'stdbuf', 'setsid', 'ionice', 'chrt', 'taskset', 'xargs' aos wrappers ou tratar wrapper desconhecido + 'git' em qualquer posicao como 'ask never_auto'."
      sketch: "ShellVerdict(..., never_auto=True) para push; Decision(never_auto=base.never_auto or worst.never_auto); runtime._approve: `if self.auto: return not request.never_auto`"
      risk: "baixo; muda so a aprovacao automatica de pushes"
      rollback: "reverter o commit; os testes novos voltam a falhar"
    tests_to_add:
      - "tests/security/test_w4.py::test_auto_never_approves_a_push_with_the_default_policy (parametrizado: env, timeout, git -c, git -C, /usr/bin/git, GIT.EXE)"
      - "tests/security/test_w4.py::test_auto_never_approves_a_push_under_a_corpus_supplied_policy"
    related: ["APR-004", "SEC-001", "SEC-007", "TRUST-003"]

