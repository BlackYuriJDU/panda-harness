# Trilha C — pontos cegos (Fase 3) + checklist Windows (Fase 6). Commit 704f387. Prosa em pt-BR.
findings:
  - id: "R2-300"
    kind: new
    title: "Descoberta de workspace sobe por todos os ancestrais sem checar dono: .panda/ plantado em /tmp ou C:\\ vira o workspace do usuário (classe CVE-2022-24765 do git)"
    severity: P2
    confidence: high
    status: confirmed
    evidence_level: E3
    root_cause: "RC-300"
    class: ["trust-boundary", "workspace-discovery", "prompt-injection-surface", "owasp:LLM01", "trifecta:untrusted_content", "windows"]
    boundary: "B1"
    preconditions: "Outra conta local consegue criar diretório num ancestral comum (C:\\ no Windows é gravável por usuários autenticados por padrão; /tmp no Linux). Usuário roda `panda`/`panda run`/`panda validate` num subdiretório sem .panda próprio."
    locations:
      - "src/panda_core/workspace.py:35-37@704f387"
      - "src/panda_core/workspace.py:40-53@704f387"
      - "src/panda_core/workspace.py:130-157@704f387"
      - "src/panda_core/workspace.py:366-371@704f387"
    claim: "find_workspace_root/Workspace.load aceitam o primeiro ancestral com .panda/config.json (ou corpus/validation/validate.mjs) sem comparar dono nem parar em fronteira de diretório pessoal; o instructions.md, a política e o validador de outra conta passam a valer."
    evidence:
      - {leg: A, method: static, detail: "_candidates() = [cwd, *cwd.parents] (workspace.py:35-37); load() retorna o primeiro candidate com config (:136-139) e, sem config, o primeiro com DEFAULT_VALIDATOR (:147-149). Nenhum os.stat().st_uid/ACL é consultado; safe_read só recusa symlink."}
      - {leg: B, method: executed, command: "pytest poc/C/test_c_blindspots.py::test_ancestor_workspace_owned_by_other_user_is_not_adopted", output_excerpt: "AssertionError: workspace adopted from an ancestor owned by uid 4242 (root == .../shared)"}
    falsification: "O threat model diz 'o usuário controla a máquina'; mas o corpus já é tratado como hostil e o git tratou exatamente este caso (C:\\.git) como vulnerabilidade. Testado com chown para uid 4242: adotado."
    impact: "Injeção de prompt persistente (instructions.md do atacante no system prompt), ledger gravado em diretório do atacante (vazamento da conversa), e no fallback do validador o `validate` (allow sem aprovação) executa validate.mjs do atacante com node."
    fix: {approach: "Parar a subida no primeiro diretório cujo dono difere do usuário atual (POSIX st_uid; Windows: dono via GetSecurityInfo ou recusar raiz de volume) e em $HOME; opcional PANDA_CEILING_DIRECTORIES como GIT_CEILING_DIRECTORIES.", sketch: "for c in candidates: if os.name!='nt' and c.stat().st_uid!=os.getuid(): break", risk: "baixo: workspaces legítimos pertencem ao usuário", rollback: "variável de ambiente para desligar a checagem"}
    tests_to_add: ["tests/security/test_w0.py::test_ancestor_workspace_owned_by_other_user_is_not_adopted"]
    related: ["TRUST-001", "TRUST-005", "R2-104"]
  - id: "R2-301"
    kind: new
    title: "Cofre de credenciais: arquivo temporário nasce com o umask (0644) e só depois vira 0600; cofre existente com 0644 é aceito em silêncio"
    severity: P3
    confidence: high
    status: confirmed
    evidence_level: E3
    root_cause: "RC-301"
    class: ["secret-handling", "toctou", "owasp:LLM02"]
    boundary: "B7"
    preconditions: "Máquina multiusuário; diretório do cofre atravessável por outros (XDG_DATA_HOME/PANDA_CREDENTIALS_FILE em local compartilhado, ou ~ com 0755, comum em Linux)."
    locations:
      - "src/panda_core/atomic.py:86-101@704f387"
      - "src/panda_core/credentials.py:69-110@704f387"
      - "src/panda_core/credentials.py:117-127@704f387"
    claim: "atomic_write_text abre o tmp com open(...,'w') (modo 0666&~umask), escreve e faz fsync da chave, e só então chama os.chmod(tmp, 0o600); _read_keys não verifica o modo do arquivo existente."
    evidence:
      - {leg: A, method: static, detail: "atomic.py:92-97: open(tmp,'w') -> write -> fsync -> chmod (suprimindo OSError). credentials.py:71 path.read_text sem stat."}
      - {leg: B, method: executed, command: "pytest poc/C/test_c_blindspots.py -k credential_store", output_excerpt: "temp modes seen: ['0o644'] ; loose vault mode accepted silently (420 & 63)"}
    falsification: "A janela é curta e o diretório pai costuma ser privado; mas um leitor pode abrir o fd durante a janela e mantê-lo. Medido: o conteúdo com a chave já está no disco em 0644 no fsync."
    impact: "Chave do provedor legível por outra conta local durante a janela (ou para sempre, se o cofre foi copiado com 0644). Também vale para os arquivos de .panda/ e backups escritos pelo mesmo helper."
    fix: {approach: "Criar o tmp com os.open(tmp, O_WRONLY|O_CREAT|O_EXCL, mode) e fdopen; criar o diretório do cofre com 0700; em _read_keys avisar/recusar se st_mode & 0o077 (POSIX).", sketch: "fd = os.open(tmp, os.O_WRONLY|os.O_CREAT|os.O_EXCL|getattr(os,'O_BINARY',0), mode)", risk: "baixo", rollback: "reverter helper"}
    tests_to_add: ["tests/test_credentials.py::test_credential_store_temp_file_is_never_world_readable", "tests/test_credentials.py::test_credential_store_existing_loose_permissions_are_refused"]
    related: ["SEC-009"]
