  related:
  - R2-500
  - R2-204
- id: R2-406
  kind: new
  title: MCP policy_check(approved=True) grava no ledger 'policy.decision effect=allow approved=true' para git push
    sem nenhuma pessoa
  severity: P3
  confidence: high
  status: confirmed
  evidence_level: E3
  root_cause: RC-D5
  class:
  - provenance
  - mcp
  - owasp:LLM06
  boundary: B4
  preconditions: qualquer cliente MCP (stdio ou HTTP loopback)
  locations:
  - src/panda_core/mcp_server.py:91@704f387
  - src/panda_core/mcp_server.py:97@704f387
  - src/panda_core/service.py:206@704f387
  - src/panda_core/service.py:211@704f387
  - src/panda_core/policy.py:528@704f387
  claim: O parâmetro approved é controlado pelo cliente/modelo e o serviço registra effect=allow, approved=true,
    reason '(approved once)' — indistinguível de uma aprovação humana no ledger.
  evidence:
  - leg: A
    method: static
    detail: 'service.py:206-221 chama engine.authorize(approved=True) e grava ''approved'': approved.'
  - leg: B
    method: executed
    command: PYTHONDONTWRITEBYTECODE=1 /home/user/.venv-a5/bin/python -I /tmp/claude-0/trackD/mcpcheck.py
    output_excerpt: '{''effect'': ''allow'', ''rule_id'': ''shell-push'', ''reason'': ''(approved once)'', ''approved'':
      True}

      policy.decision {"action": "shell", "resource": "git push origin main", "effect": "allow", "rule_id": "shell-push",
      "risk": "high", "approved": true}'
  falsification: Nada é executado (policy_check é consulta); o dano é a proveniência forjável e um modelo que 'aprende'
    que push está liberado.
  impact: Ledger com aprovação falsa de push; leitor humano do ledger pode concluir que houve consentimento.
  fix:
    approach: Remover 'approved' do MCP ou registrar como hypothetical=true sem effect=allow; nunca escrever approved=true
      sem aprovador humano.
    sketch: payload['hypothetical_if_approved'] = 'allow' if decision.effect == 'ask' else decision.effect; não
      chamar authorize(approved=True)
    risk: baixo (quebra clientes que usam o flag)
    rollback: manter flag mas gravar decided_by='mcp-client-hypothetical'
  tests_to_add:
  - tests/test_service_mcp.py::test_policy_check_approved_flag_never_records_human_approval
  related:
  - R2-405
