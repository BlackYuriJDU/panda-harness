- id: R2-404
  kind: new
  title: 'Saída de ''panda run'' para máquinas: max_steps/incomplete saem com código 1 (''validation failed''),
    ações negadas terminam ''completed''/0, erros não geram JSON no stdout'
  severity: P3
  confidence: high
  status: confirmed
  evidence_level: E2
  root_cause: RC-D4
  class:
  - machine-interface
  - contract
  - observability
  boundary: B6
  preconditions: consumidor CI/script de 'panda run --json'
  locations:
  - src/panda_cli/main.py:562@704f387
  - src/panda_cli/main.py:567@704f387
  - src/panda_cli/main.py:569@704f387
  - src/panda_cli/main.py:68@704f387
  - src/panda_cli/render.py:53@704f387
  - src/panda_cli/main.py:490@704f387
  - docs/CONTRACT.md:271@704f387
  - docs/CONTRACT.md:275@704f387
  claim: O contrato reserva 1 para validação e 5 para 'ask fora de aprovação interativa', mas run devolve 1 para
    max_steps/incomplete e 0 quando todas as ações foram bloqueadas; em erro, handle() imprime texto Rich no stderr
    e nada no stdout, mesmo com --json; --dry-run --json imprime texto.
  evidence:
  - leg: A
    method: static
    detail: 'main.py:567-569 ''if result.status != "completed": raise typer.Exit(1)''; _authorize transforma ask
      sem aprovador em ToolResult blocked (tools.py:238-241) e o turno segue ''completed''; handle() -> render.print_error
      (render.py:53-61) só stderr; dry_run (main.py:490-499) usa typer.echo.'
  - leg: B
    method: independent
    detail: 'Leitura cruzada com CONTRACT.md §5 (linhas 266-276) e §4 (linha 189-191: ''--json emits machine-readable
      output on stdout for successful results''): o próprio contrato só promete JSON em sucesso, e não mapeia status
      de turno para código.'
  falsification: O contrato diz 'use o exit code'; mas o exit code não distingue 'agente bloqueado' de sucesso nem
    'sem passos' de 'validação falhou'.
  impact: Pipelines tratam 'agente esgotou passos' como falha de validação e 'agente bloqueado pela política' como
    sucesso; sem JSON de erro, o session_id só sai no stderr.
  fix:
    approach: Tabela status->exit (completed 0, max_steps 7?, incomplete 4, blocked-only 5) por emenda de contrato;
      em --json sempre imprimir um objeto (sucesso ou PandaError.to_dict + session_id); incluir blocked_calls, denied_approvals,
      files_changed, validate_last no payload.
    sketch: 'except PandaError as exc: if json_output: render.print_json({**exc.to_dict(), ''session_id'': log.session_id});
      raise typer.Exit(exc.exit_code)'
    risk: 'médio: mudança de contrato público'
    rollback: manter códigos antigos atrás de --legacy-exit
  tests_to_add:
  - tests/test_cli.py::test_run_json_emits_error_object_on_provider_error
  - tests/test_cli.py::test_run_exit_code_distinguishes_max_steps_from_validation_failure
  - tests/test_cli.py::test_run_reports_blocked_calls
  related: []
- id: R2-405
  kind: new
  title: 'Ledger não registra quem aprovou: aprovação por --auto e por pessoa geram o mesmo approval.decision, e
    run.start não guarda o flag auto'
  severity: P3
  confidence: high
  status: confirmed
  evidence_level: E2
  root_cause: RC-D5
  class:
  - provenance
  - observability
  - owasp:LLM06
  boundary: B7
  preconditions: qualquer sessão com --auto
  locations:
  - src/panda_cli/runtime.py:119@704f387
  - src/panda_cli/runtime.py:122@704f387
  - src/panda_core/agent.py:299@704f387
  - src/panda_cli/main.py:472@704f387
  claim: ChatRuntime._approve devolve True para --auto sem marcar a origem; Agent._approve grava só {tool, action,
    approved}; run_data (main.py:472-482) não tem 'auto'.
  evidence:
  - leg: A
    method: static
    detail: 'runtime.py:120-122; agent.py:299-302; grep por ''auto'' em src/panda_core/session.py e main.py: nenhum
      campo de origem.'
  - leg: B
    method: independent
    detail: grep -rn '"auto"\|approved_by' src -> só provider.py tool_choice='auto' (nenhum registro de origem da
      aprovação).
  falsification: --auto é decisão do operador e pode ser lembrada fora do ledger; mas o ledger é a promessa de proveniência
    (C-3, D do CONTRACT §1).
  impact: Auditoria posterior não distingue 'pessoa leu a prévia e aprovou' de 'aprovado em lote'; combina mal com
    R2-500 (never_auto por rule_id).
  fix:
    approach: 'approval.decision ganha decided_by: human|auto|policy|mcp e rule_id/effect/risk; run.start/session.start
      ganham approval_mode.'
    sketch: 'self._log(''approval.decision'', {..., ''decided_by'': request_origin, ''rule_id'': request.rule_id,
      ''risk'': request.risk})'
    risk: baixo (campo novo)
    rollback: remover campo
  tests_to_add:
