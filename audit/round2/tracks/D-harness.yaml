  kind: improvement
  title: '[#3] Git com configuração isolada para toda invocação que Panda considera read-only (probe e run_shell
    allow)'
  confidence: high
  status: probable
  root_cause: ''
  class:
  - improvement
  - security
  source: '[web: https://code.claude.com/docs/en/permissions, retrieved 2026-11-03] (exemplo ''git -c core.fsmonitor=<script>
    diff main'' e prompt em ''cd'' + git ''can execute that directory''s hooks''); [web: https://developers.openai.com/codex/agent-approvals-security,
    retrieved 2026-11-03] (.git protegido read-only dentro de writable roots)'
  value: 'Fecha R2-101, R2-106, R2-201: config do corpus (fsmonitor, diff.external, textconv, filtros, pager, hooks,
    sshCommand) deixa de executar código sem aprovação.'
  cost: M
  fix:
    approach: 'Wrapper safe_git(argv): env GIT_CONFIG_NOSYSTEM=1, GIT_CONFIG_GLOBAL=/dev/null (NUL no Windows),
      GIT_ATTR_NOSYSTEM=1, GIT_TERMINAL_PROMPT=0, GIT_PAGER=cat, GIT_EXTERNAL_DIFF vazio, GIT_CEILING_DIRECTORIES=<pai
      do workspace>; argv com -c core.fsmonitor= -c core.hooksPath=<dir vazio> -c diff.external= -c core.pager=cat
