  claim: _claim_records pula em silêncio arquivos negados/links; claim_list não informa omitted_by_policy (list_files
    e grep informam) e claim_show devolve 'claim not found' em vez de um resultado blocked com a regra.
  evidence:
  - leg: A
    method: static
    detail: tools.py:933-937 'continue' sem contador; tools.py:992 ToolInputError('claim not found').
  - leg: B
    method: executed
    command: PYTHONDONTWRITEBYTECODE=1 /home/user/.venv-a5/bin/python -I /tmp/claude-0/trackD/aci_checks.py claims
    output_excerpt: 'claim_list {} -> ... "count":1,"total":1 (2 arquivos existem)

