- id: IMP-402
  kind: improvement
  title: '[#4] never_auto e risco pela classe do efeito resolvido (publish/push/network-send/destructive), não pelo rule_id; --auto aprova só classes listadas'
  confidence: high
  status: probable
  root_cause: ''
  class:
  - improvement
  - security
  source: '[web: https://learn.chatgpt.com/docs/sandboxing, retrieved 2026-11-03] (aprovação e sandbox como eixos separados); [web: https://docs.openhands.dev/sdk/arch/security.md, retrieved 2026-11-03]
    (risco LOW/MEDIUM/HIGH por ação); [web: https://inspect.aisi.org.uk/approval.html, retrieved 2026-11-03] (approvers por padrão de ferramenta/argumento)'
  value: 'Fecha R2-500, R2-204, R2-501: renomear uma regra ou publicar via gh/twine/npm deixa de escapar; o auto passa de denylist a allowlist.'
  cost: M
  fix:
    approach: Decision ganha effect_class calculado pelo classificador de argv (read, write_workspace, exec_local, network, publish, history_rewrite, destructive), independente do policy.json; NEVER_AUTO
