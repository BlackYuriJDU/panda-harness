- id: IMP-400
  kind: improvement
  title: '[#2] Política de shell por argv (estilo Codex prefix_rule) com exemplos match/not_match validados na carga e decisão mais restritiva vence'
  confidence: high
  status: probable
  root_cause: ''
  class:
  - improvement
  - security
  source: '[web: https://learn.chatgpt.com/docs/agent-configuration/rules, retrieved 2026-11-03] (''Examples that Codex validates when it loads your rules''; ''forbidden > prompt > allow''); [web: https://code.claude.com/docs/en/permissions,
    retrieved 2026-11-03] (regras de texto ''isn''t a security boundary around the program'')'
  value: 'Elimina a comparação por texto unido e por prefixo (R2-100, R2-205, R2-103/R2-202, R2-203, R2-117): a regra casa tokens, não string; erros de regra aparecem ao carregar, não num relatório de bug.'
  cost: M
  fix:
    approach: 'Regra de shell = {pattern: [token|[alternativas]...], decision, justification, match: [[argv]], not_match: [[argv]]}; argv[0] normalizado por basename só se for resolvido por which() fora
      do workspace; allow exige casamento exato do programa (sem prefixo de string); opções globais do git (-c, -C, --git-dir, --exec-path) tornam a regra inaplicável (cai em ask); ''precedência deny>ask>allow''
      em vez de ''last match wins''. Mesma função para run_shell, policy_check, MCP e ''!cmd''.'
    sketch: PrefixRule(pattern=[['git'],['status','diff','log','show']], decision='allow', match=[['git','status']], not_match=[['git','-c','core.fsmonitor=x','status'],['git status','x']])
    risk: 'médio: reescrita do módulo de política; manter o classificador atual como segunda camada'
    rollback: flag para o motor antigo por uma versão
  tests_to_add:
  - tests/security/test_execpolicy.py::test_rule_examples_are_checked_at_load
  - tests/security/test_execpolicy.py::test_argv0_with_space_never_matches_allow
  related:
  - R2-100
  - R2-205
  - R2-202
  - R2-203
  - R2-117
  - SEC-001
  - SEC-007
