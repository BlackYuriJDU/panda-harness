line-length = 100
target-version = "py312"
# taskbridge.py is Google's file, copied unmodified; it keeps its own style.
extend-exclude = ["taskbridge.py"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S603", "S607"]
